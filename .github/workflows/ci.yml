name: ci

on:
  push:
  pull_request:

jobs:
  check:
    # No GPU, no ComfyUI, no torch. That is what makes "sdga never imports ComfyUI" a
    # checked property rather than a claim: an accidental import fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Typecheck
        run: mypy

      - name: Tests
        run: pytest -m "not slow and not gpu"

      - name: plan.json is byte-stable
        run: |
          sdga plan --project examples
          git diff --exit-code examples/plan.json

      - name: Generate and gate one asset
        run: sdga run --project examples --asset terrain/moss_stone

      - name: Publish
        run: sdga publish --project examples --allow-unreviewed

      - name: Validate the pack with no backend
        run: sdga validate --project examples "$(ls -d examples/packs/* | head -1)"

      # P3's whole claim is "nothing changed means nothing regenerated". A second run of the
      # same asset must be one cache hit and zero generations; a resumed run of a complete
      # run must generate nothing at all.
      - name: Second run is a cache hit
        run: |
          sdga run --project examples --asset terrain/moss_stone | tee /tmp/rerun.log
          grep -q "cache: 1 hit(s), 0 generated" /tmp/rerun.log

      - name: Resuming a finished run generates nothing
        run: |
          sdga run --project examples --asset terrain/moss_stone --resume latest | tee /tmp/resume.log
          grep -q "cache: 1 hit(s), 0 generated" /tmp/resume.log

      - name: Kill-and-resume leaves no duplicate generations
        run: pytest tests/test_p3.py -k "killed_run or corrupt_cache"

      # P4's gate, on the runner: no soundfont, no fluidsynth binary, no GPU. Eight tracks
      # derived from one authored phrase must all pass beat_alignment and audio_loop_seam.
      - name: "P4 gate: eight tracks from one leitmotif"
        run: |
          sdga run --project examples \
            --asset music/cave --asset music/combat --asset music/desert \
            --asset music/forest --asset music/snow --asset music/swamp \
            --asset music/title --asset music/town | tee /tmp/p4.log
          grep -q "8 accepted, 0 rejected" /tmp/p4.log
          python - <<'PY'
          import json, pathlib
          run = sorted(pathlib.Path("examples/runs").glob("*/run.json"))[-1]
          record = json.loads(run.read_text(encoding="utf-8"))
          jobs = [job for job in record["jobs"] if job["kind"] == "music_track"]
          assert len(jobs) == 8, len(jobs)
          for job in jobs:
              gates = {gate["gate"]: gate["status"] for gate in job["gates"]}
              assert gates["beat_alignment"] == "pass", (job["asset_id"], gates)
              assert gates["audio_loop_seam"] == "pass", (job["asset_id"], gates)
              assert job["loop"]["end_s"] == round(job["post"][0]["duration_s"], 6)
          PY
