name: ci

on:
  push:
  pull_request:

jobs:
  check:
    # No GPU, no ComfyUI, no torch. That is what makes "sdga never imports ComfyUI" a
    # checked property rather than a claim: an accidental import fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Typecheck
        run: mypy

      - name: Tests
        run: pytest -m "not slow and not gpu"

      - name: Doctor on the example project
        run: sdga doctor --project examples

      - name: plan.json is byte-stable
        run: |
          sdga plan --project examples
          git diff --exit-code examples/plan.json

      - name: Generate and gate one asset
        run: sdga run --project examples --asset terrain/moss_stone

      - name: Publish
        run: sdga publish --project examples --allow-unreviewed

      - name: Validate the pack with no backend
        run: sdga validate --project examples "$(ls -d examples/packs/* | head -1)"

      # P3's whole claim is "nothing changed means nothing regenerated". A second run of the
      # same asset must be one cache hit and zero generations; a resumed run of a complete
      # run must generate nothing at all.
      - name: Second run is a cache hit
        run: |
          sdga run --project examples --asset terrain/moss_stone | tee /tmp/rerun.log
          grep -q "cache: 1 hit(s), 0 generated" /tmp/rerun.log

      - name: Resuming a finished run generates nothing
        run: |
          sdga run --project examples --asset terrain/moss_stone --resume latest | tee /tmp/resume.log
          grep -q "cache: 1 hit(s), 0 generated" /tmp/resume.log

      - name: Kill-and-resume leaves no duplicate generations
        run: pytest tests/test_p3.py -k "killed_run or corrupt_cache"

      # P4's gate, on the runner: no soundfont, no fluidsynth binary, no GPU. Eight tracks
      # derived from one authored phrase must all pass beat_alignment and audio_loop_seam.
      - name: "P4 gate: eight tracks from one leitmotif"
        run: |
          sdga run --project examples \
            --asset music/cave --asset music/combat --asset music/desert \
            --asset music/forest --asset music/snow --asset music/swamp \
            --asset music/title --asset music/town | tee /tmp/p4.log
          grep -q "8 accepted, 0 rejected" /tmp/p4.log
          python - <<'PY'
          import json, pathlib
          run = sorted(pathlib.Path("examples/runs").glob("*/run.json"))[-1]
          record = json.loads(run.read_text(encoding="utf-8"))
          jobs = [job for job in record["jobs"] if job["kind"] == "music_track"]
          assert len(jobs) == 8, len(jobs)
          for job in jobs:
              gates = {gate["gate"]: gate["status"] for gate in job["gates"]}
              assert gates["beat_alignment"] == "pass", (job["asset_id"], gates)
              assert gates["audio_loop_seam"] == "pass", (job["asset_id"], gates)
              # examples/ uses bed = "texture": the offline bed path is the CI gate for the
              # mix, not a feature only exercised on a developer machine.
              assert job["bed"]["kind"] == "texture", (job["asset_id"], job.get("bed"))
              # The loop point is the solved bar length; the file is quantised to whole
              # samples, so allow one sample of rounding rather than demanding equality.
              assert abs(job["loop"]["end_s"] - job["post"][0]["duration_s"]) <= 1e-3
          PY

      # P5's gate: a full fake-backend run, a published pack, and two adapter runs that must
      # be byte-identical. No Godot binary is installed anywhere in this job.
      - name: "P5 gate: adapt a full pack for Godot"
        run: |
          sdga run --project examples | tee /tmp/p5.log
          grep -q "16 accepted, 0 rejected" /tmp/p5.log
          sdga publish --project examples --allow-unreviewed
          PACK=$(ls -d examples/packs/* | tail -1)
          sdga validate --project examples "$PACK"
          sdga adapt --project examples --pack "$PACK" --out /tmp/godot-a --fps 8
          sdga adapt --project examples --pack "$PACK" --out /tmp/godot-b --fps 8
          diff -r /tmp/godot-a /tmp/godot-b
          python - <<'PY'
          import json, pathlib
          out = pathlib.Path("/tmp/godot-a")
          hints = json.loads((out / "godot_import.json").read_text(encoding="utf-8"))
          sprites = json.loads((out / "sprite_frames.json").read_text(encoding="utf-8"))
          buses = json.loads((out / "audio_buses.json").read_text(encoding="utf-8"))
          ninepatch = json.loads((out / "ninepatch.json").read_text(encoding="utf-8"))
          manifest = json.loads((out / "manifest.json").read_text(encoding="utf-8"))
          assert hints["files"]["assets/terrain/moss_stone.png"]["filter"] is False
          assert hints["files"]["assets/terrain/moss_stone.png"]["mipmaps"] is False
          assert hints["files"]["assets/char/ranger_walk.png"]["compression"] == "lossless"
          sprite = sprites["sprites"]["char/ranger_walk"]
          assert sprite["frames"] > 1, sprite
          assert len(sprite["frame_size"]) == 2
          covered = [index for clip in sprite["animations"].values() for index in clip["frames"]]
          assert sorted(covered) == list(range(sprite["frames"])), sprite["animations"]
          pack = json.loads(
              sorted(pathlib.Path("examples/packs").glob("*/pack.json"))[-1].read_text(encoding="utf-8")
          )
          ui = next(asset for asset in pack["assets"] if asset["kind"] == "ui_element")
          assert ninepatch["assets"]["ui/button_normal"]["margins"] == {
              "left": ui["engine"]["ui"]["margins"][0],
              "top": ui["engine"]["ui"]["margins"][1],
              "right": ui["engine"]["ui"]["margins"][2],
              "bottom": ui["engine"]["ui"]["margins"][3],
          }, ninepatch
          walk = sprites["sprites"]["char/ranger_walk"]["animations"]["walk"]
          assert walk["frames"] == list(range(8))
          assert walk["speed"] == 10.0, walk
          assert walk["loop"] is True, walk
          assert ui["engine"]["ui"]["mirror"] is True, ui
          assert buses["assets"]["music/title"]["bus"] == "Music"
          assert buses["assets"]["sfx/pickup"]["bus"] == "SFX"
          assert hints["files"]["assets/music/title.wav"]["loop_end_frame"] > 0
          assert hints["files"]["assets/sfx/pickup.wav"]["loop_mode"] == 0
          assert set(manifest["files"]) == {
              "audio_buses.json", "godot_import.json", "ninepatch.json", "sprite_frames.json"
          }
          PY

      # P6's gate: retention must not touch a published run, and a byte-level edit that
      # still passes the art gates must fail validation. Both run with no backend.
      - name: "P6 gate: retention and pack integrity"
        run: |
          sdga gc --project examples --keep-runs 1 --keep-packs all --dry-run --json > /tmp/gc.json
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path("/tmp/gc.json").read_text(encoding="utf-8"))
          assert report["schema"] == 1
          assert report["dry_run"] is True
          assert report["deleted"] == []
          assert report["protected"], "published runs must be protected"
          assert all(target["path"] for target in report["targets"])
          assert all(target["path"] for target in report["protected"])
          PY
          PACK=$(ls -d examples/packs/* | tail -1)
          rm -rf /tmp/tampered-pack
          cp -r "$PACK" /tmp/tampered-pack
          printf 'tampered' >> /tmp/tampered-pack/assets/terrain/moss_stone.png
          if sdga validate --project examples /tmp/tampered-pack; then
            echo "validate accepted a tampered pack" >&2
            exit 1
          fi
