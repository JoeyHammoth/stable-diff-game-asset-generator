[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdga"
version = "0.1.0"
description = "Engine-neutral game asset generation pipeline. A client of ComfyUI, never an importer of it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
  "mypy>=1.13",
  "types-PyYAML",
]

[project.scripts]
sdga = "sdga.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: takes more than a second",
  "gpu: needs a live ComfyUI backend",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Doc examples are illustrations, not modules: formatting them is churn, not consistency.
extend-exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/sdga"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# Domain types are checked strictly: they are the contract every other module leans on,
# so a missing annotation there is a design bug rather than a style opinion.
[[tool.mypy.overrides]]
module = ["sdga.model", "sdga.model.*"]
strict = true
