name: live-comfyui

# The other half of the test strategy: a real server, real weights, real node names. It needs a
# self-hosted runner with ComfyUI already listening, because this job cannot provision a GPU.
# The repository secrets SDGA_COMFY_URL, SDGA_CKPT and SDGA_LORA point at that server and at the
# model filenames installed on it. Editing a recipe's graph without re-running this is how node
# drift reaches a human.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: One real tile, gated and published
        env:
          SDGA_COMFY_URL: ${{ secrets.SDGA_COMFY_URL }}
          SDGA_CKPT: ${{ secrets.SDGA_CKPT }}
          SDGA_LORA: ${{ secrets.SDGA_LORA }}
        run: pytest tests/test_live_comfyui.py -m gpu -rs
