schema: 1
id: terrain_tile
version: 3
graph: terrain_tile.graph.json
output_node: "12"

# The deterministic half. Everything after the sampler: average down before snapping so
# structure survives, snap to the one palette, harden alpha, then pad to whole cells.
postprocess:
  - downscale_box
  - palette_snap
  - alpha_hard
  - pad_to_grid

gates:
  - dimensions_exact
  - grid_divisible
  - palette_conformance
  - max_unique_colors
  - seamless_tile

requires:
  nodes:
    - CheckpointLoaderSimple
    - LoraLoader
    - CLIPTextEncode
    - EmptyLatentImage
    - KSampler
    - VAEDecode
    - SaveImage
  models:
    checkpoints: ["${style.checkpoint}"]
    loras: ["${style.loras[0].name}"]

slots:
  required: [positive, negative, seed, width, height]
  optional: [style_anchor]
