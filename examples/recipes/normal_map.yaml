schema: 1
id: normal_map
version: 1
graph: normal_map.graph.json
output_node: "12"

# The backend renders a height/depth read of the asset; `depth_to_normal` is what turns it
# into a normal map. Palette snapping is deliberately absent: a normal map is not palette art.
postprocess:
  - downscale_box
  - depth_to_normal
  - pad_to_grid

gates:
  - dimensions_exact
  - grid_divisible
  - normal_map_valid

requires:
  nodes:
    - CheckpointLoaderSimple
    - LoraLoader
    - CLIPTextEncode
    - EmptyLatentImage
    - KSampler
    - VAEDecode
    - SaveImage
  models:
    checkpoints: ["${style.checkpoint}"]
    loras: ["${style.loras[0].name}"]

slots:
  required: [positive, negative, seed, width, height, params.height_strength]
  optional: [params.flip_g, refs.albedo.handle]
